<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cerita untuk Nazira</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #e8dce5;
      font-family: Georgia, serif;
      text-align: center;
      background:
        radial-gradient(circle at 78% 24%, #eee6d5 0 3px, transparent 4px),
        radial-gradient(circle at 78% 24%, #d9d5ce 0 38px, transparent 39px),
        radial-gradient(2px 2px at 10% 18%, #fff 98%, transparent),
        radial-gradient(2px 2px at 25% 32%, #cbd8e0 98%, transparent),
        radial-gradient(2px 2px at 42% 12%, #fff 98%, transparent),
        radial-gradient(2px 2px at 58% 27%, #cbd8e0 98%, transparent),
        radial-gradient(2px 2px at 91% 48%, #fff 98%, transparent),
        linear-gradient(#071018, #17212a);
    }

    main {
      width: min(90%, 720px);
      padding: 32px 20px;
      border: 1px solid #c8aab255;
      border-radius: 18px;
      background: #071018aa;
      box-shadow: 0 0 40px #c8aab222;
    }

    h1 {
      color: #e2cdd3;
      font-size: clamp(28px, 7vw, 48px);
    }

    #teks {
      min-height: 100px;
      font-size: clamp(19px, 4vw, 26px);
      line-height: 1.7;
    }

    button {
      padding: 12px 24px;
      border: 1px solid #e2cdd3;
      border-radius: 24px;
      color: #071018;
      background: #e2cdd3;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: white; }
  </style>
</head>
<body>
  <main>
    <h1>Cerita untuk Nazira</h1>
    <p id="teks">Tekan tombol untuk memulai cerita.</p>
    <button id="lanjut">Mulai</button>
  </main>

  <script>
    const cerita = [
      "Hai.",
      "Terima kasih sudah meluangkan sedikit waktu untuk membaca ini.",
      "Aku tidak ingin membuatnya terlalu panjang.",
      "Aku hanya ingin menyampaikan beberapa hal yang selama ini ada di pikiranku.",
      "Jadi, izinkan aku bercerita sedikit."
    ];

    const teks = document.getElementById("teks");
    const tombol = document.getElementById("lanjut");
    let nomor = 0;
    let timer;

    tombol.addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }

      if (nomor >= cerita.length) {
        nomor = 0;
        tombol.textContent = "Ulangi cerita";
      } else {
        tombol.textContent = "Lanjut";
      }

      const kalimat = cerita[nomor++];
      teks.textContent = "";
      let huruf = 0;

      timer = setInterval(() => {
        teks.textContent += kalimat[huruf++];
        if (huruf >= kalimat.length) {
          clearInterval(timer);
          timer = null;
        }
      }, 45);
    });
  </script>
</body>
</html>
